<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 음악">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>내 음악</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #15171c; --sub: #6b7280;
    --line: #e5e7eb; --accent: #ff4d6d; --accent-weak: #ffe4e9; --btn: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #f3f4f6; --sub: #9ca3af;
      --line: #2a2e37; --accent: #ff5c7a; --accent-weak: #3a1f27; --btn: #262a33;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 0;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 8px;
  }
  header h1 { font-size: 24px; margin: 0; flex: 1; }
  .icon-btn {
    border: 0; background: var(--btn); color: var(--text);
    border-radius: 999px; height: 36px; padding: 0 14px; font-size: 14px; font-weight: 600;
  }
  .icon-btn.accent { background: var(--accent); color: #fff; }
  .search { padding: 0 16px 8px; }
  .search input {
    width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font-size: 16px;
  }
  .meta { padding: 0 16px 6px; color: var(--sub); font-size: 13px; }
  #list { list-style: none; margin: 0; padding: 0 0 8px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  #list li {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; border-bottom: 1px solid var(--line);
  }
  #list li .num { width: 26px; color: var(--sub); font-size: 13px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  #list li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li.current { background: var(--accent-weak); }
  #list li.current .name { color: var(--accent); font-weight: 600; }
  #list li .del { border: 0; background: none; color: var(--sub); font-size: 18px; padding: 4px 6px; }
  .empty { padding: 48px 24px; text-align: center; color: var(--sub); }
  .empty b { color: var(--text); }

  #player {
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  #np { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 22px; }
  .seek { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
  .seek input { flex: 1; accent-color: var(--accent); }
  .controls { display: flex; align-items: center; justify-content: space-between; }
  .controls button {
    border: 0; background: none; color: var(--text); width: 52px; height: 52px; border-radius: 999px;
    display: grid; place-items: center; position: relative;
  }
  .controls button svg { width: 26px; height: 26px; fill: currentColor; }
  .controls button.mode svg { width: 22px; height: 22px; }
  .controls button.mode { color: var(--sub); }
  .controls button.mode.on { color: var(--accent); }
  .controls button.mode .badge { position: absolute; right: 9px; bottom: 9px; font-size: 9px; font-weight: 800; }
  #playBtn { background: var(--accent); color: #fff; width: 62px; height: 62px; }
  #playBtn svg { width: 30px; height: 30px; }
  .controls button:disabled { opacity: .35; }
  #status { font-size: 12px; color: var(--sub); text-align: center; min-height: 16px; }
</style>
</head>
<body>
  <header>
    <h1>내 음악</h1>
    <button class="icon-btn accent" id="addBtn">+ 추가</button>
    <button class="icon-btn" id="clearBtn">전체 삭제</button>
  </header>
  <div class="search"><input id="q" type="search" placeholder="곡 검색" autocomplete="off"></div>
  <div class="meta" id="meta"></div>
  <ul id="list"></ul>
  <input type="file" id="fileInput" accept="audio/mpeg,audio/mp3,.mp3,audio/*" multiple hidden>

  <section id="player">
    <div id="np">재생 중인 곡 없음</div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button class="mode" id="shuffleBtn" aria-label="무작위 재생">
        <svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg>
      </button>
      <button id="prevBtn" aria-label="이전 곡">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="playBtn" aria-label="재생">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" aria-label="다음 곡">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="mode" id="repeatBtn" aria-label="반복">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <span class="badge" id="repeatBadge"></span>
      </button>
      <button class="mode" id="stopBtn" aria-label="종료">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </div>
    <div id="status"></div>
  </section>

<script>
(() => {
  const PLAY_PATH = 'M8 5v14l11-7z';
  const PAUSE_PATH = 'M6 5h4v14H6zm8 0h4v14h-4z';
  const $ = id => document.getElementById(id);

  // ---------- IndexedDB (mp3는 기기 안에만 저장) ----------
  const DB_NAME = 'local-music', STORE = 'tracks';
  const dbReady = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  async function tx(mode, fn) {
    const db = await dbReady;
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, mode);
      const out = fn(t.objectStore(STORE));
      t.oncomplete = () => resolve(out && out.result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  const dbAll = () => tx('readonly', s => s.getAll());
  const dbPut = rec => tx('readwrite', s => s.put(rec));
  const dbDel = id => tx('readwrite', s => s.delete(id));
  const dbClear = () => tx('readwrite', s => s.clear());

  // ---------- 상태 ----------
  const audio = new Audio();
  audio.preload = 'auto';
  let tracks = [];          // [{id, name, blob}] 이름순
  let order = [];           // 재생 순서 (tracks 인덱스)
  let pos = -1;             // order 내 현재 위치
  let currentUrl = null;
  const settings = loadSettings();

  function loadSettings() {
    try { return Object.assign({ shuffle: false, repeat: 'all' }, JSON.parse(localStorage.getItem('player-settings') || '{}')); }
    catch { return { shuffle: false, repeat: 'all' }; }
  }
  function saveSettings() {
    try { localStorage.setItem('player-settings', JSON.stringify(settings)); } catch {}
  }

  const collator = new Intl.Collator('ko', { numeric: true, sensitivity: 'base' });
  const displayName = n => n.replace(/\.[^.]+$/, '');
  const fmt = s => {
    if (!isFinite(s)) return '0:00';
    s = Math.floor(s);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  const currentIdx = () => (pos >= 0 ? order[pos] : -1);
  const currentTrack = () => tracks[currentIdx()];

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  // 현재 곡을 맨 앞에 둔 채로 순서를 다시 만든다
  function rebuildOrder(keepIdx = currentIdx()) {
    const all = tracks.map((_, i) => i);
    if (settings.shuffle) {
      order = shuffled(all.filter(i => i !== keepIdx));
      if (keepIdx >= 0) order.unshift(keepIdx);
      pos = keepIdx >= 0 ? 0 : -1;
    } else {
      order = all;
      pos = keepIdx;
    }
  }

  // ---------- 재생 ----------
  function playAt(newPos) {
    if (newPos < 0 || newPos >= order.length) return;
    pos = newPos;
    const t = currentTrack();
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(t.blob);
    audio.src = currentUrl;
    audio.play().catch(err => setStatus('재생 실패: ' + err.message));
    updateMediaSession();
    render();
  }
  function playTrackIndex(idx) {
    if (settings.shuffle) rebuildOrder(idx);
    playAt(order.indexOf(idx));
  }
  function next(auto = false) {
    if (!order.length) return;
    if (auto && settings.repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
    if (pos + 1 < order.length) return playAt(pos + 1);
    if (settings.repeat === 'all' || !auto) {
      if (settings.shuffle) { order = shuffled(order); }
      return playAt(0);
    }
    stop(); // 반복 꺼짐 + 마지막 곡 끝
  }
  function prev() {
    if (!order.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    playAt(pos > 0 ? pos - 1 : order.length - 1);
  }
  function togglePlay() {
    if (!tracks.length) return;
    if (pos < 0) {
      rebuildOrder(-1);
      return playAt(0);
    }
    if (audio.paused) audio.play().catch(err => setStatus('재생 실패: ' + err.message));
    else audio.pause();
  }
  function stop() {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
    pos = -1;
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = null;
      navigator.mediaSession.playbackState = 'none';
    }
    render();
  }

  audio.addEventListener('ended', () => next(true));
  audio.addEventListener('play', renderControls);
  audio.addEventListener('pause', renderControls);
  audio.addEventListener('loadedmetadata', renderTime);
  audio.addEventListener('timeupdate', renderTime);
  audio.addEventListener('error', () => {
    if (audio.getAttribute('src')) setStatus('이 파일은 재생할 수 없습니다.');
  });

  // ---------- 잠금화면 / 제어센터 컨트롤 ----------
  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const t = currentTrack();
    if (!t) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: displayName(t.name), artist: '내 음악', album: '내 음악',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  }
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    const set = (a, h) => { try { ms.setActionHandler(a, h); } catch {} };
    set('play', () => togglePlay());
    set('pause', () => audio.pause());
    set('previoustrack', prev);
    set('nexttrack', () => next());
    set('stop', stop);
    set('seekto', d => { audio.currentTime = d.seekTime; });
  }

  // ---------- 파일 추가 ----------
  $('addBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = async e => {
    const files = [...e.target.files].filter(f => /\.mp3$/i.test(f.name) || f.type.startsWith('audio/'));
    e.target.value = '';
    if (!files.length) return;
    const existing = new Set(tracks.map(t => t.name + '|' + t.blob.size));
    let added = 0;
    for (const [i, f] of files.entries()) {
      setStatus(`추가 중… ${i + 1}/${files.length}`);
      if (existing.has(f.name + '|' + f.size)) continue;
      // File을 그대로 넣으면 원본 경로를 참조할 수 있어 Blob으로 복사해 저장
      const blob = new Blob([await f.arrayBuffer()], { type: f.type || 'audio/mpeg' });
      await dbPut({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random(), name: f.name, blob });
      added++;
    }
    await reload();
    setStatus(added ? `${added}곡 추가됨` : '이미 있는 곡입니다');
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  };

  $('clearBtn').onclick = async () => {
    if (!tracks.length || !confirm('저장된 모든 곡을 이 기기에서 삭제할까요?')) return;
    stop();
    await dbClear();
    await reload();
  };

  async function deleteTrack(idx) {
    const t = tracks[idx];
    if (!confirm(`"${displayName(t.name)}" 을(를) 삭제할까요?`)) return;
    if (idx === currentIdx()) stop();
    await dbDel(t.id);
    await reload();
  }

  async function reload() {
    const keepId = currentTrack() && currentTrack().id;
    tracks = (await dbAll()).sort((a, b) => collator.compare(a.name, b.name));
    const keepIdx = tracks.findIndex(t => t.id === keepId);
    rebuildOrder(keepIdx);
    render();
  }

  // ---------- 화면 ----------
  let statusTimer;
  function setStatus(msg) {
    $('status').textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { $('status').textContent = ''; }, 3000);
  }

  function renderList() {
    const list = $('list');
    const q = $('q').value.trim().toLowerCase();
    list.innerHTML = '';
    if (!tracks.length) {
      list.innerHTML = '<li class="empty" style="display:block;border:0"><b>곡이 없습니다</b><br><br>' +
        '<b>+ 추가</b>를 눌러 파일 앱에서 mp3 폴더를 열고<br>오른쪽 위 <b>선택</b> → <b>모두 선택</b> → <b>열기</b>를 누르세요.<br><br>' +
        '파일은 인터넷에 올라가지 않고 이 기기 안에만 저장됩니다.</li>';
      $('meta').textContent = '';
      return;
    }
    const cur = currentIdx();
    let shown = 0;
    const frag = document.createDocumentFragment();
    tracks.forEach((t, i) => {
      const name = displayName(t.name);
      if (q && !name.toLowerCase().includes(q)) return;
      shown++;
      const li = document.createElement('li');
      if (i === cur) li.className = 'current';
      li.innerHTML = `<span class="num">${i === cur ? '♪' : i + 1}</span><span class="name"></span><button class="del" aria-label="삭제">×</button>`;
      li.querySelector('.name').textContent = name;
      li.onclick = ev => {
        if (ev.target.classList.contains('del')) return deleteTrack(i);
        if (i === cur) togglePlay(); else playTrackIndex(i);
      };
      frag.appendChild(li);
    });
    list.appendChild(frag);
    $('meta').textContent = q ? `${shown} / ${tracks.length}곡` : `${tracks.length}곡`;
  }

  function renderControls() {
    const t = currentTrack();
    $('np').textContent = t ? displayName(t.name) : '재생 중인 곡 없음';
    const playing = t && !audio.paused;
    $('playIcon').firstElementChild.setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
    $('playBtn').setAttribute('aria-label', playing ? '일시정지' : '재생');
    ['playBtn', 'prevBtn', 'nextBtn'].forEach(id => { $(id).disabled = !tracks.length; });
    $('stopBtn').disabled = !t;
    $('shuffleBtn').classList.toggle('on', settings.shuffle);
    $('repeatBtn').classList.toggle('on', settings.repeat !== 'off');
    $('repeatBadge').textContent = settings.repeat === 'one' ? '1' : '';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = t ? (playing ? 'playing' : 'paused') : 'none';
  }

  let seeking = false;
  function renderTime() {
    const d = audio.duration;
    $('dur').textContent = fmt(d);
    $('seek').max = isFinite(d) ? d : 0;
    if (!seeking) {
      $('seek').value = audio.currentTime || 0;
      $('cur').textContent = fmt(audio.currentTime);
    }
  }
  function render() { renderList(); renderControls(); renderTime(); }

  $('seek').addEventListener('input', () => { seeking = true; $('cur').textContent = fmt(+$('seek').value); });
  $('seek').addEventListener('change', () => { audio.currentTime = +$('seek').value; seeking = false; });
  $('q').addEventListener('input', renderList);

  $('playBtn').onclick = togglePlay;
  $('nextBtn').onclick = () => next();
  $('prevBtn').onclick = prev;
  $('stopBtn').onclick = stop;
  $('shuffleBtn').onclick = () => {
    settings.shuffle = !settings.shuffle;
    saveSettings();
    rebuildOrder();
    setStatus(settings.shuffle ? '무작위 재생' : '순차 재생');
    renderControls();
  };
  $('repeatBtn').onclick = () => {
    settings.repeat = { off: 'all', all: 'one', one: 'off' }[settings.repeat];
    saveSettings();
    setStatus({ off: '반복 안 함', all: '전체 반복', one: '한 곡 반복' }[settings.repeat]);
    renderControls();
  };

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  reload().catch(err => setStatus('저장소를 열 수 없습니다: ' + err.message));
})();
</script>
</body>
</html>
